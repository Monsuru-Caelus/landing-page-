<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@200..800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05070a; }
    @keyframes caelus-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.78); } }
  </style>
</helmet>

<div style="position: fixed; inset: 0; overflow: hidden; background: #05070a; color: #eef1f5; font-family: 'Ojuju', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- TOP CONTAINER: space -->
  <section style="position: relative; flex: 1 1 60%; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 3.4vw, 48px);">

  <canvas ref="{{ canvasRef }}" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; z-index: 0;"></canvas>

  <!-- depth + color overlays -->
  <div style="position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(150,140,210,0.10) 0%, rgba(150,140,210,0) 42%);"></div>
  <div style="position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 100% 82% at 50% 32%, rgba(5,7,10,0) 46%, rgba(5,7,10,0.5) 100%);"></div>

  <!-- header -->
  <header style="position: relative; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;">
    <div style="font-weight: 600; font-size: clamp(12px, 1vw, 14px); letter-spacing: 0.34em; text-transform: uppercase; color: #eef1f5;">Caelus&nbsp;Industries</div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
      <sc-if value="{{ showBadge }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #7ec6d6; box-shadow: 0 0 10px 1px rgba(126,198,214,0.8); animation: caelus-pulse 2.6s ease-in-out infinite;"></span>
          <span style="font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8b95a3;">In Stealth</span>
        </div>
      </sc-if>
      <div style="font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #5b6675; white-space: nowrap;">© 2026 Caelus Industries</div>
    </div>
  </header>

  <!-- main statement -->
  <main style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; max-width: 880px;">
    <div style="display: flex; align-items: center; gap: 11px; margin-bottom: clamp(20px, 2.4vw, 30px);">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #6fa9b8;"></span>
      <span style="font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: clamp(11px, 1.05vw, 13px); letter-spacing: 0.3em; text-transform: uppercase; color: #6fa9b8;">Maritime Infrastructure</span>
    </div>

    <h1 style="margin: 0; font-weight: 500; font-size: clamp(34px, 5.4vw, 70px); line-height: 1.03; letter-spacing: -0.02em; color: #f3f5f8; max-width: 16ch; text-wrap: balance;"><span style="font-size: clamp(34px, 5.4vw, 70px); letter-spacing: -0.02em; text-wrap-mode: initial;"><b><span style="font-weight: normal; font-size: 56px">Autonomous maritime workforce for the ocean.</span></b></span></h1>

    <p style="margin: clamp(20px, 2.4vw, 28px) 0 0; font-weight: 300; font-size: clamp(13px, 1.7vw, 20px); line-height: 1.5; letter-spacing: 0.005em; color: #9aa3b0; max-width: 40ch">Defend, maintain, monitor, and create new financial markets from maritime assets.</p>
  </main>

  <!-- footer -->
  <footer style="position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: clamp(11px, 1vw, 13px); letter-spacing: 0.06em;">
    <a href="mailto:Hello@caelusindustries.com" style="color: #c4ccd6; text-decoration: none; border-bottom: 1px solid rgba(196,204,214,0.25); padding-bottom: 2px; transition: border-color .25s, color .25s;" style-hover="color: #ffffff; border-color: rgba(126,198,214,0.9);">Hello@caelusindustries.com</a>
  </footer>

    <!-- bottom fade: starfield melts into the seam -->
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(5,7,10,0) 0%, rgba(6,12,18,0.32) 45%, rgba(6,14,20,0.6) 72%, rgba(7,20,28,0.92) 100%);"></div>
  </section>

  <!-- BOTTOM CONTAINER: ocean footage -->
  <section style="position: relative; flex: 0 0 40vh; overflow: hidden; background: #05070a;">
    <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
      <video ref="{{ videoRef }}" src="{{ effVideo }}" autoplay="" loop="" muted="" playsinline="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></video>
      <video ref="{{ videoRef2 }}" src="{{ effVideo }}" autoplay="" loop="" muted="" playsinline="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; will-change: opacity;"></video>
    </sc-if>
    <!-- top fade: video rises out of the same darkness, dissolving the seam (taller = endless horizon) -->
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 82%; z-index: 2; pointer-events: none; background: linear-gradient(to bottom, rgba(7,20,28,0.99) 0%, rgba(6,15,22,0.9) 22%, rgba(6,13,19,0.62) 46%, rgba(5,9,13,0.32) 70%, rgba(5,7,10,0.08) 88%, rgba(5,7,10,0) 100%);"></div>
    <sc-if value="{{ showDropHint }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; right: 0; bottom: clamp(16px, 2vw, 28px); z-index: 2; display: flex; justify-content: center; pointer-events: none;">
        
      </div>
    </sc-if>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;videoSrc&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;oceanSpeed&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Slow&quot;, &quot;options&quot;: [&quot;Slow&quot;, &quot;Medium&quot;, &quot;Real-time&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;motion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;density&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Balanced&quot;, &quot;options&quot;: [&quot;Sparse&quot;, &quot;Balanced&quot;, &quot;Dense&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;showStealthBadge&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  canvasRef = (el) => { if (el) this.canvas = el; };
  oceanRef = (el) => { if (el) this.oceanCanvas = el; };
  _wantPlay = true;
  _videos = [];
  _rvfcSet = new Set();

  _speed() {
    const s = this.props.oceanSpeed || 'Slow';
    return s === 'Real-time' ? 1 : (s === 'Medium' ? 0.7 : 0.5);
  }

  // Keep each video's frame pipeline fed so the browser doesn't throttle
  // muted, audio-less playback to a standstill.
  _loopRVFC(el) {
    if (!el || !el.requestVideoFrameCallback || this._rvfcSet.has(el)) return;
    this._rvfcSet.add(el);
    const cb = () => {
      if (el.requestVideoFrameCallback && this._videos.indexOf(el) >= 0) el.requestVideoFrameCallback(cb);
      else this._rvfcSet.delete(el);
    };
    el.requestVideoFrameCallback(cb);
  }

  _register(el, idx) {
    el.muted = true;
    el.defaultMuted = true;
    el.playbackRate = this._speed();
    this._videos[idx] = el;
    const start = () => {
      el.playbackRate = this._speed();
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      this._loopRVFC(el);
    };
    start();
    el.addEventListener('loadeddata', start);
    el.addEventListener('canplay', start);
    el.addEventListener('pause', () => { if (!document.hidden) { const p = el.play(); if (p && p.catch) p.catch(() => {}); } });
  }

  videoRef = (el) => { if (el && el !== this._videos[0]) this._register(el, 0); };
  videoRef2 = (el) => { if (el && el !== this._videos[1]) this._register(el, 1); };

  _kick = () => {
    if (!this._wantPlay || document.hidden) return;
    for (const el of this._videos) {
      if (!el) continue;
      el.playbackRate = this._speed();
      if (el.paused) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
      this._loopRVFC(el);
    }
  };

  // Conservative un-freeze: only re-kick after a sustained freeze (~1.5s).
  _watch = () => {
    if (!this._wantPlay || document.hidden) return;
    for (const el of this._videos) {
      if (el && el.readyState >= 2 && el.paused) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
    }
    const v1 = this._videos[0];
    if (v1 && !v1.paused && v1.readyState >= 2) {
      const t = v1.currentTime;
      if (this._lastWatchT != null && Math.abs(t - this._lastWatchT) < 0.001) {
        this._stallN = (this._stallN || 0) + 1;
        if (this._stallN >= 3) { const p = v1.play(); if (p && p.catch) p.catch(() => {}); this._stallN = 0; }
      } else { this._stallN = 0; }
      this._lastWatchT = t;
    }
  };

  // Continuous cross-dissolve between two copies offset by half the clip,
  // so each one's loop seam is hidden behind the other — no visible cut.
  _fade = () => {
    const v1 = this._videos[0], v2 = this._videos[1];
    if (v1 && v2 && isFinite(v1.duration) && v1.duration > 0) {
      const D = v1.duration;
      const p1 = (v1.currentTime % D) / D;
      const op = 0.5 + 0.5 * Math.cos(2 * Math.PI * p1); // top (v2) opacity
      v2.style.opacity = op.toFixed(3);
      const desired = (v1.currentTime + D / 2) % D;
      let diff = Math.abs(v2.currentTime - desired);
      diff = Math.min(diff, D - diff);
      if (op < 0.12 && diff > 0.2) { try { v2.currentTime = desired; } catch (e) {} }
    }
    this._fadeRaf = requestAnimationFrame(this._fade);
  };
  mx = 0; my = 0; tmx = 0; tmy = 0;
  state = { videoUrl: '' };

  _onMove = (e) => {
    this.tmx = (e.clientX / window.innerWidth) * 2 - 1;
    this.tmy = (e.clientY / window.innerHeight) * 2 - 1;
  };

  _onDragOver = (e) => { e.preventDefault(); };
  _onDrop = (e) => {
    e.preventDefault();
    const files = e.dataTransfer ? Array.from(e.dataTransfer.files) : [];
    const v = files.find((f) => f.type.indexOf('video') === 0);
    if (v) this.setState({ videoUrl: URL.createObjectURL(v) });
  };

  _hasVideo() { return !!((this.state && this.state.videoUrl) || this.props.videoSrc); }

  _countFor(d) { return d === 'Sparse' ? 150 : d === 'Dense' ? 380 : 250; }

  _build(n) {
    const rnd = (a, b) => a + Math.random() * (b - a);
    this.parts = [];
    for (let i = 0; i < n; i++) {
      this.parts.push({
        x: Math.random(),
        y: Math.random(),
        s: rnd(0.4, 1.9),
        spd: rnd(0.4, 1.2),
        ph: Math.random() * Math.PI * 2,
      });
    }
  }

  _flow(x, y, t) {
    return Math.sin(x * 3.1 + t * 0.00026) * 1.2
         + Math.cos(y * 4.0 - t * 0.00019) * 1.0
         + Math.sin((x + y) * 2.2 + t * 0.0004) * 0.7;
  }

  _colorFor(o) {
    if (o > 0.58) return '126,198,214';
    if (o > 0.34) return '150,178,214';
    return '197,191,232';
  }

  _resize = () => {
    const c = this.canvas; if (!c) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = c.clientWidth || window.innerWidth;
    this.H = c.clientHeight || window.innerHeight;
    c.width = Math.floor(this.W * this.dpr);
    c.height = Math.floor(this.H * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.ctx.fillStyle = '#05070a';
    this.ctx.fillRect(0, 0, this.W, this.H);
    if (!(this.props.motion ?? true)) this._drawStatic();
    if (this.octx) this._resizeOcean();
  };

  _oceanInit() {
    this.owaves = [
      { base: 0.18, amp: 11, len: 1.7,  sp: 0.00012, par: 5,  parx: 0.14, col: '50,116,138', a: 0.42 },
      { base: 0.33, amp: 16, len: 1.25, sp: 0.00018, par: 9,  parx: 0.24, col: '36,96,124',  a: 0.56 },
      { base: 0.50, amp: 22, len: 0.95, sp: 0.00026, par: 14, parx: 0.40, col: '24,76,106',  a: 0.74 },
      { base: 0.67, amp: 30, len: 0.70, sp: 0.00037, par: 22, parx: 0.62, col: '13,52,76',   a: 0.96 },
    ];
  }

  _resizeOcean = () => {
    const c = this.oceanCanvas; if (!c || !this.octx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.oW = c.clientWidth;
    this.oH = c.clientHeight;
    c.width = Math.floor(this.oW * dpr);
    c.height = Math.floor(this.oH * dpr);
    this.octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!(this.props.motion ?? true)) this._oceanStatic();
  };

  _drawOWave(w, t, foam) {
    const ctx = this.octx, W = this.oW, H = this.oH;
    const baseY = w.base * H - this.my * w.par;
    const amp = w.amp * (H / 440);
    const k = (Math.PI * 2) / (w.len * W);
    const ph = t * w.sp + this.mx * w.parx;
    const step = Math.max(6, W / 220);
    const surf = (x) => baseY + Math.sin(x * k + ph) * amp + Math.sin(x * k * 2.3 + ph * 1.6) * amp * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, surf(0));
    for (let x = step; x <= W; x += step) ctx.lineTo(x, surf(x));
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = 'rgba(' + w.col + ',' + w.a + ')';
    ctx.fill();
    if (foam) {
      ctx.beginPath();
      ctx.moveTo(0, surf(0));
      for (let x = step; x <= W; x += step) ctx.lineTo(x, surf(x));
      ctx.strokeStyle = 'rgba(174,222,236,0.16)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
  }

  _oceanFrame(t) {
    const ctx = this.octx;
    ctx.clearRect(0, 0, this.oW, this.oH);
    for (let i = 0; i < this.owaves.length; i++) this._drawOWave(this.owaves[i], t, i >= 2);
  }

  _oceanStatic() { if (this.octx) this._oceanFrame(0); }

  _parallaxSpace() {
    if (this.canvas) this.canvas.style.transform = 'scale(1.08) translate(' + (-this.mx * 12).toFixed(1) + 'px,' + (-this.my * 8).toFixed(1) + 'px)';
  }

  _oceanTick = (t) => {
    this._oceanFrame(t);
    this.oraf = requestAnimationFrame(this._oceanTick);
  };

  _drawStatic() {
    const ctx = this.ctx;
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, this.W, this.H);
    for (const p of this.parts) {
      const o = p.y;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + this._colorFor(o) + ',' + (0.12 + 0.35 * o).toFixed(3) + ')';
      ctx.arc(p.x * this.W, p.y * this.H, p.s * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  _tick = (t) => {
    this.mx += (this.tmx - this.mx) * 0.06;
    this.my += (this.tmy - this.my) * 0.06;
    this._parallaxSpace();
    const ctx = this.ctx, W = this.W, H = this.H;
    ctx.fillStyle = 'rgba(5,7,10,0.11)';
    ctx.fillRect(0, 0, W, H);
    for (const p of this.parts) {
      const o = p.y;
      const px = p.x * W, py = p.y * H;
      const ang = this._flow(p.x, p.y, t);
      const sp = (0.0004 + o * o * 0.0016) * p.spd;
      let nx = p.x + Math.cos(ang) * sp * (0.5 + o);
      let ny = p.y + Math.sin(ang) * sp * 0.5 - (1 - o) * 0.00018;
      if (nx < 0) nx += 1; else if (nx > 1) nx -= 1;
      if (ny < 0) ny += 1; else if (ny > 1) ny -= 1;
      p.x = nx; p.y = ny;
      const npx = nx * W, npy = ny * H;
      const col = this._colorFor(o);
      if (o > 0.5) {
        const dx = npx - px, dy = npy - py;
        if (Math.abs(dx) < W * 0.25 && Math.abs(dy) < H * 0.25) {
          ctx.strokeStyle = 'rgba(' + col + ',' + (0.07 + 0.33 * o).toFixed(3) + ')';
          ctx.lineWidth = 0.6 + p.s * 0.55;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(npx, npy);
          ctx.stroke();
        }
      } else {
        const tw = 0.5 + 0.5 * Math.sin(t * 0.0021 * p.spd + p.ph);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + col + ',' + (0.1 + 0.42 * tw).toFixed(3) + ')';
        ctx.arc(npx, npy, p.s * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    this.raf = requestAnimationFrame(this._tick);
  };

  _apply() {
    const motion = this.props.motion ?? true;
    if (motion) {
      if (!this.raf) this.raf = requestAnimationFrame(this._tick);
    } else {
      if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
      this._drawStatic();
    }
    if (this.octx) {
      if (this.oraf) { cancelAnimationFrame(this.oraf); this.oraf = null; }
      this.octx.clearRect(0, 0, this.oW, this.oH);
    }
  }

  componentDidMount() {
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this._build(this._countFor(this.props.density || 'Balanced'));
    this._resize();
    if (this.oceanCanvas) {
      this.octx = this.oceanCanvas.getContext('2d');
      this._oceanInit();
      this._resizeOcean();
    }
    window.addEventListener('resize', this._resize);
    window.addEventListener('mousemove', this._onMove);
    window.addEventListener('dragover', this._onDragOver);
    window.addEventListener('drop', this._onDrop);
    document.addEventListener('visibilitychange', this._kick);
    window.addEventListener('pointerdown', this._kick);
    window.addEventListener('focus', this._kick);
    this._kickTimer = setInterval(this._kick, 1500);
    this._watchTimer = setInterval(this._watch, 500);
    this._fadeRaf = requestAnimationFrame(this._fade);
    this._apply();
  }

  componentDidUpdate(prev) {
    if (prev.density !== this.props.density) {
      this._build(this._countFor(this.props.density || 'Balanced'));
    }
    this._kick();
    this._apply();
  }

  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.oraf) cancelAnimationFrame(this.oraf);
    window.removeEventListener('resize', this._resize);
    window.removeEventListener('mousemove', this._onMove);
    window.removeEventListener('dragover', this._onDragOver);
    window.removeEventListener('drop', this._onDrop);
    document.removeEventListener('visibilitychange', this._kick);
    window.removeEventListener('pointerdown', this._kick);
    window.removeEventListener('focus', this._kick);
    if (this._kickTimer) clearInterval(this._kickTimer);
    if (this._watchTimer) clearInterval(this._watchTimer);
    if (this._fadeRaf) cancelAnimationFrame(this._fadeRaf);
  }

  renderVals() {
    const PLACEHOLDER = 'uploads/Ocean-46829559.mp4';
    // Only accept a blob: URL (drag-drop) or a direct video file URL.
    // A web-page URL (e.g. a pixabay.com/videos/... page) is NOT playable and must be ignored.
    const isPlayable = (u) => !!u && (u.indexOf('blob:') === 0 || u.indexOf('data:video') === 0 || /\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(u));
    const dropped = this.state && this.state.videoUrl;
    const prop = this.props.videoSrc;
    const userVideo = (isPlayable(dropped) && dropped) || (isPlayable(prop) && prop) || '';
    const effVideo = userVideo || PLACEHOLDER;
    return {
      canvasRef: this.canvasRef,
      oceanRef: this.oceanRef,
      showBadge: this.props.showStealthBadge ?? true,
      videoRef: this.videoRef,
      videoRef2: this.videoRef2,
      effVideo: effVideo,
      hasVideo: true,
      showDropHint: !userVideo,
    };
  }
}
</script>
</body>
</html>
